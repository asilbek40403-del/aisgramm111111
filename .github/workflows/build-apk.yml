name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        run: |
          cat buildsrc/project.b64.* | tr -d '\n\r' | base64 -d > project.zip
          mkdir project
          unzip -q project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Patch Aisgram 0.2 auth UX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("project/app/src/main/java/com/aisgram/messenger/SupabaseApi.java")
          s=p.read_text()
          needle='    public JSONObject signUp(String email, String password, String username, String displayName) throws Exception {\n'
          insert='''    public void sendPasswordReset(String email) throws Exception {
              JSONObject body = new JSONObject();
              body.put("email", email.trim());
              requestRaw("POST", "/auth/v1/recover", body, false, false, true);
          }

          public void resendSignupConfirmation(String email) throws Exception {
              JSONObject body = new JSONObject();
              body.put("type", "signup");
              body.put("email", email.trim());
              requestRaw("POST", "/auth/v1/resend", body, false, false, true);
          }

          '''
          if insert not in s:
              s=s.replace(needle, insert+needle)
          p.write_text(s)

          p=Path("project/app/src/main/java/com/aisgram/messenger/LoginActivity.java")
          s=p.read_text()
          s=s.replace('''        login = Ui.button(this, "Войти");
                  Button register = Ui.button(this, "Создать аккаунт");

                  root.addView(email);
                  root.addView(password);
                  root.addView(login);
                  root.addView(register);
          ''','''        login = Ui.button(this, "Войти");
                  Button forgot = Ui.button(this, "Забыли пароль? Отправить письмо");
                  Button register = Ui.button(this, "Создать аккаунт");

                  root.addView(email);
                  root.addView(password);
                  root.addView(login);
                  root.addView(forgot);
                  root.addView(register);
          ''')
          s=s.replace('''        login.setOnClickListener(v -> doLogin());
                  register.setOnClickListener(v -> startActivity(new Intent(this, RegisterActivity.class)));
          ''','''        login.setOnClickListener(v -> doLogin());
                  forgot.setOnClickListener(v -> sendResetEmail(forgot));
                  register.setOnClickListener(v -> startActivity(new Intent(this, RegisterActivity.class)));
          ''')
          marker='    private void doLogin() {\n'
          method='''    private void sendResetEmail(Button button) {
              String e = email.getText().toString().trim();
              if (e.isEmpty() || !e.contains("@")) {
                  Toast.makeText(this, "Сначала введи email", Toast.LENGTH_SHORT).show();
                  return;
              }
              Ui.disable(button, true);
              io.execute(() -> {
                  try {
                      api.sendPasswordReset(e);
                      runOnUiThread(() -> {
                          Ui.disable(button, false);
                          Toast.makeText(this, "Если аккаунт существует, письмо для смены пароля отправлено. Проверь Входящие и Спам.", Toast.LENGTH_LONG).show();
                      });
                  } catch (Exception ex) {
                      runOnUiThread(() -> {
                          Ui.disable(button, false);
                          Toast.makeText(this, ex.getMessage(), Toast.LENGTH_LONG).show();
                      });
                  }
              });
          }

          '''
          if method not in s:
              s=s.replace(marker, method+marker)
          p.write_text(s)

          p=Path("project/app/src/main/java/com/aisgram/messenger/RegisterActivity.java")
          s=p.read_text()
          s=s.replace('''        create = Ui.button(this, "Зарегистрироваться");
                  Button back = Ui.button(this, "Назад ко входу");
                  root.addView(display); root.addView(username); root.addView(email); root.addView(password); root.addView(create); root.addView(back);
          ''','''        create = Ui.button(this, "Зарегистрироваться");
                  Button resend = Ui.button(this, "Отправить подтверждение ещё раз");
                  Button back = Ui.button(this, "Назад ко входу");
                  root.addView(display); root.addView(username); root.addView(email); root.addView(password); root.addView(create); root.addView(resend); root.addView(back);
          ''')
          s=s.replace('''        create.setOnClickListener(v -> register());
                  back.setOnClickListener(v -> finish());
          ''','''        create.setOnClickListener(v -> register());
                  resend.setOnClickListener(v -> resendConfirmation(resend));
                  back.setOnClickListener(v -> finish());
          ''')
          marker='    private void register() {\n'
          method='''    private void resendConfirmation(Button button) {
              String e = email.getText().toString().trim();
              if (e.isEmpty() || !e.contains("@")) {
                  Toast.makeText(this, "Сначала введи email", Toast.LENGTH_SHORT).show();
                  return;
              }
              Ui.disable(button, true);
              io.execute(() -> {
                  try {
                      api.resendSignupConfirmation(e);
                      runOnUiThread(() -> {
                          Ui.disable(button, false);
                          Toast.makeText(this, "Запрос отправлен. Проверь Входящие и Спам.", Toast.LENGTH_LONG).show();
                      });
                  } catch (Exception ex) {
                      runOnUiThread(() -> {
                          Ui.disable(button, false);
                          Toast.makeText(this, ex.getMessage(), Toast.LENGTH_LONG).show();
                      });
                  }
              });
          }

          '''
          if method not in s:
              s=s.replace(marker, method+marker)
          s=s.replace('Toast.makeText(this, "Аккаунт создан. Подтверди email, затем войди.", Toast.LENGTH_LONG).show();',
                      'Toast.makeText(this, "Если это новый аккаунт, проверь письмо подтверждения. Если email уже зарегистрирован — войди или нажми «Забыли пароль?».", Toast.LENGTH_LONG).show();')
          p.write_text(s)

          p=Path("project/app/build.gradle")
          s=p.read_text().replace("versionCode 1","versionCode 2").replace("versionName '0.1.0'","versionName '0.2.0'")
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20

      - name: Build debug APK
        run: cd project && gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aisgram-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
